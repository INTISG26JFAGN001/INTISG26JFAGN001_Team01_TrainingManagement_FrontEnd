<header class="app-header">
  <div class="header-left">
    <button class="icon-btn menu-btn" (click)="menuToggle.emit()">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="search-bar">
      <mat-icon class="search-icon">search</mat-icon>
      <input #searchFieldInput type="text" placeholder="Search SkillSync..." class="search-input" list="searchDataList"/>
      <button class="search-btn" (click)="handleSearch(searchFieldInput.value)">Search</button>
      <datalist id="searchDataList">
        <option>Users</option>
        <option>Associates</option>
        <option>Trainers</option>
        <option>Schedules</option>
        <option>Enrollments</option>
        <option>Technologies</option>
        <option>Courses</option>
        <option>Stages</option>
        <option>Quizzes</option>
        <option>Projects</option>
        <option>Interviews</option>
      </datalist>
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn" (click)="toggleTheme()" [matTooltip]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <div class="user-menu" [matMenuTriggerFor]="userMenu">
      <div class="avatar">{{ username.charAt(0).toUpperCase() }}</div>
      <mat-icon class="chevron">expand_more</mat-icon>
    </div>

    <mat-menu #userMenu="matMenu" class="user-dropdown">
      <div class="menu-user-info">
        <span class="menu-username" style="font-size: 1.2rem; width: 100%; overflow: hidden;text-overflow: ellipsis;white-space: nowrap;">{{ username }}</span>
        <span class="menu-role">{{ getRoleLabel() }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="goToProfile()" >
        <mat-icon>person_outline</mat-icon><span style="font-size: 0.85rem;">My Profile</span>
      </button>
      <button mat-menu-item (click)="logout()" class="logout-item">
        <mat-icon>logout</mat-icon><span style="font-size: 0.85rem;">Sign Out</span>
      </button>
    </mat-menu>
  </div>
</header>
