<div class="page-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Courses</h2>
      <p>Manage training courses and their curriculum</p>
    </div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="canEdit">
      <mat-icon>add</mat-icon> Add Course
    </button>
  </div>

  <mat-card class="content-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search courses...</mat-label>
        <input matInput (keyup)="applyFilter($event)"/>
      </mat-form-field>
    </div>

    <div class="table-container" *ngIf="!loading; else loadingTpl">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let c"><span class="id-chip">{{ c.id }}</span></td>
        </ng-container>

        <!-- Code -->
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
          <td mat-cell *matCellDef="let c"><span class="code-chip">{{ c.code }}</span></td>
        </ng-container>

        <!-- Title -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Course Title</th>
          <td mat-cell *matCellDef="let c">
            <div class="course-cell">
              <mat-icon class="course-icon">import_contacts</mat-icon>
              {{ c.title }}
            </div>
          </td>
        </ng-container>

        <!-- Technology -->
        <ng-container matColumnDef="technology">
          <th mat-header-cell *matHeaderCellDef>Technology</th>
          <td mat-cell *matCellDef="let c"><span class="tech-chip">{{ getTechName(c) }}</span></td>
        </ng-container>

        <!-- Duration -->
        <ng-container matColumnDef="duration">
          <th mat-header-cell *matHeaderCellDef>Duration</th>
          <td mat-cell *matCellDef="let c">{{ c.durationDays }} days</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let c">
            <button mat-icon-button color="primary" (click)="openForm(c)" *ngIf="canEdit" matTooltip="Edit course"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(c)" *ngIf="canEdit" matTooltip="Delete course"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="no-data">No courses found.</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
