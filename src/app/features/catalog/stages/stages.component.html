<div class="page-container">
  <div class="page-header">
    <div class="header-info"><h2>Stages</h2><p>Manage training stages and course phases</p></div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="canEdit"><mat-icon>add</mat-icon> Add Stage</button>
  </div>
  <mat-card class="form-card" *ngIf="showForm">
    <mat-card-header><mat-card-title>{{ editId ? 'Edit' : 'New' }} Stage</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" class="grid-form">
        <mat-form-field appearance="outline"><mat-label>Stage Name</mat-label><input matInput formControlName="name"/></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Course</mat-label>
          <mat-select formControlName="courseId"><mat-option *ngFor="let c of courses" [value]="c.id">{{ c.name }}</mat-option></mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Order</mat-label><input matInput type="number" formControlName="order"/></mat-form-field>
        <mat-form-field appearance="outline" class="span-full"><mat-label>Description</mat-label><input matInput formControlName="description"/></mat-form-field>
        <div class="form-actions span-full">
          <button mat-stroked-button type="button" (click)="closeForm()">Cancel</button>
          <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || saving">{{ saving ? 'Saving...' : 'Save' }}</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  <mat-card class="content-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field"><mat-icon matPrefix>search</mat-icon><mat-label>Search stages...</mat-label><input matInput (keyup)="applyFilter($event)"/></mat-form-field>
    </div>
    <div class="table-container" *ngIf="!loading; else loadingTpl">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">
        <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Stage</th><td mat-cell *matCellDef="let s"><div class="stage-cell"><mat-icon>layers</mat-icon>{{ s.name }}</div></td></ng-container>
        <ng-container matColumnDef="course"><th mat-header-cell *matHeaderCellDef>Course</th><td mat-cell *matCellDef="let s">{{ getCourseName(s.courseId) }}</td></ng-container>
        <ng-container matColumnDef="order"><th mat-header-cell *matHeaderCellDef>Order</th><td mat-cell *matCellDef="let s"><span class="order-badge">{{ s.order }}</span></td></ng-container>
        <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let s">
            <button mat-icon-button color="primary" (click)="openForm(s)" *ngIf="canEdit"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(s)" *ngIf="canEdit"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow><td [attr.colspan]="displayedColumns.length" class="no-data">No stages found.</td></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
