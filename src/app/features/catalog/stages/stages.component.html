<div class="page-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Stages</h2>
      <p>Manage training stages and course phases</p>
    </div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="canEdit">
      <mat-icon>add</mat-icon> Add Stage
    </button>
  </div>

  <mat-card class="content-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search stages...</mat-label>
        <input matInput (keyup)="applyFilter($event)"/>
      </mat-form-field>
    </div>

    <div class="table-container" *ngIf="!loading; else loadingTpl">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let s"><span class="id-chip">{{ s.id }}</span></td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stage</th>
          <td mat-cell *matCellDef="let s">
            <div class="stage-cell">
              <mat-icon>layers</mat-icon>
              {{ s.name }}
            </div>
          </td>
        </ng-container>

        <!-- Type -->
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let s"><span class="type-chip">{{ s.type }}</span></td>
        </ng-container>

        <!-- Course -->
        <ng-container matColumnDef="course">
          <th mat-header-cell *matHeaderCellDef>Course</th>
          <td mat-cell *matCellDef="let s">{{ s.courseTitle || '—' }}</td>
        </ng-container>

        <!-- Order -->
        <ng-container matColumnDef="order">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Order</th>
          <td mat-cell *matCellDef="let s"><span class="order-badge">{{ s.ord }}</span></td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let s">
            <button mat-icon-button color="primary" (click)="openForm(s)" *ngIf="canEdit" matTooltip="Edit stage"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(s)" *ngIf="canEdit" matTooltip="Delete stage"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="no-data">No stages found.</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
