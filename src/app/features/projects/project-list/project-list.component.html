<div class="page-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Projects</h2>
      <p>View and manage project submissions</p>
    </div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="canDelete">
      <mat-icon>add</mat-icon> Submit Project
    </button>
  </div>

  <mat-card class="content-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search projects...</mat-label>
        <input matInput (keyup)="applyFilter($event)"/>
      </mat-form-field>
    </div>
    <div class="table-container" *ngIf="!loading; else loadingTpl">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Project Title</th>
          <td mat-cell *matCellDef="let p"><div class="proj-cell"><mat-icon class="proj-icon">work</mat-icon>{{ p.title }}</div></td>
        </ng-container>
        <ng-container matColumnDef="submissionDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Submitted</th>
          <td mat-cell *matCellDef="let p">{{ p.submissionDate ? (p.submissionDate | date:'mediumDate') : '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="repoUrl">
          <th mat-header-cell *matHeaderCellDef>Repository</th>
          <td mat-cell *matCellDef="let p">
            <a *ngIf="p.repoUrl" [href]="p.repoUrl" target="_blank" class="repo-link">
              <mat-icon>open_in_new</mat-icon> View
            </a>
            <span *ngIf="!p.repoUrl">—</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button color="primary" (click)="openForm(p)" matTooltip="Edit" *ngIf="canDelete">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(p)" matTooltip="Delete" *ngIf="canDelete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="no-data">No projects found.</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
