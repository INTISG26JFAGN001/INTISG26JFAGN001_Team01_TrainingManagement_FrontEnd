<div class="page-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Batch Management</h2>
      <p>Manage training batches, schedules and participants</p>
    </div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="isAdmin">
      <mat-icon>add</mat-icon> New Batch
    </button>
  </div>

  <div class="filter-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <mat-label>Search batches...</mat-label>
      <input matInput (keyup)="applyFilter($event)"/>
    </mat-form-field>
    <mat-form-field appearance="outline" class="status-filter">
      <mat-label>Filter by Status</mat-label>
      <mat-select [(value)]="statusFilter" (selectionChange)="load()">
        <mat-option value="">All Statuses</mat-option>
        <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-card class="content-card" *ngIf="!loading; else loadingTpl">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">

        <!-- Batch ID -->
        <ng-container matColumnDef="batchId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Batch ID</th>
          <td mat-cell *matCellDef="let b"><span class="id-chip">{{ b.id }}</span></td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let b">
            <span class="status-chip" [ngClass]="getStatusClass(b.status)">{{ b.status }}</span>
          </td>
        </ng-container>

        <!-- Start Date -->
        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Start Date</th>
          <td mat-cell *matCellDef="let b">{{ formatDate(b.startDate) }}</td>
        </ng-container>

        <!-- End Date -->
        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef>End Date</th>
          <td mat-cell *matCellDef="let b">{{ formatDate(b.endDate) }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let b">
            <button mat-icon-button (click)="viewDetail(b.id)" matTooltip="View Details"><mat-icon>visibility</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(b)" *ngIf="isAdmin" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewDetail(row.id)" class="clickable-row"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="no-data">No batches found.</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
