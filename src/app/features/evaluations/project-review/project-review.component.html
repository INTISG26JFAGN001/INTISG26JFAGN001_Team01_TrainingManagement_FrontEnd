<div class="list-page">

  <!-- Filter Card -->
  <div class="filter-card">
    <div class="filter-fields">
      <div class="filter-field">
        <label>Batch</label>
        <input type="text" [(ngModel)]="batchSearch" list="batch-list-project-review"
               class="field-input" placeholder="Search batch…" autocomplete="off"
               (change)="onBatchInput()" />
        <datalist id="batch-list-project-review">
          <option *ngFor="let b of batches"
                  [value]="'#' + b.id + ' — ' + (b.courseNames?.join(', ') || 'No course')">
          </option>
        </datalist>
      </div>
    </div>
  </div>

  <!-- Empty state: no batch selected -->
  <div class="empty-state" *ngIf="!batchSearch && !loading">
    <mat-icon>search</mat-icon>
    <p>Select a batch to view projects</p>
  </div>

  <!-- Loading -->
  <div class="loading-center" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Table Card -->
  <div class="table-card" *ngIf="batchSearch && !loading">
    <table mat-table [dataSource]="dataSource" matSort class="data-table">

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Project Title</th>
        <td mat-cell *matCellDef="let project">
          <div class="cell-with-icon">
            <mat-icon class="row-icon green">work</mat-icon>
            {{ project.title }}
          </div>
        </td>
      </ng-container>

      <!-- Repo URL Column -->
      <ng-container matColumnDef="repoUrl">
        <th mat-header-cell *matHeaderCellDef>Repository</th>
        <td mat-cell *matCellDef="let project">
          <a class="repo-link" [href]="project.repoUrl" target="_blank" rel="noopener"
             (click)="$event.stopPropagation()">
            <mat-icon style="font-size:14px;width:14px;height:14px;">open_in_new</mat-icon>
            {{ project.repoUrl }}
          </a>
        </td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let project" (click)="$event.stopPropagation()">
          <button mat-stroked-button color="primary" (click)="openReviewDialog(project)">
            <mat-icon>rate_review</mat-icon> Review
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="clickable-row" (click)="openReviewDialog(row)"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="no-data">
          No projects in this batch
        </td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>

</div>
