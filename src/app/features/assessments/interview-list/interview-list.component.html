<div class="list-page">

  <!-- Filter Card -->
  <div class="filter-card">
    <div class="filter-fields">
      <div class="filter-field">
        <label>Batch</label>
        <input type="text" [(ngModel)]="filter.batchId" list="batch-list-interview"
               class="field-input" placeholder="Search batch…" autocomplete="off"
               (keydown.enter)="applyFilter()" />
        <datalist id="batch-list-interview">
          <option *ngFor="let b of batches"
                  [value]="'#' + b.id + ' — ' + (b.courseNames?.join(', ') || 'No course')">
          </option>
        </datalist>
      </div>
      <div class="filter-field">
        <label>Category</label>
        <select [(ngModel)]="filter.category" class="field-input">
          <option value="">All Categories</option>
          <option value="INTERIM">Interim</option>
          <option value="FINAL">Final</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Status</label>
        <select [(ngModel)]="filter.status" class="field-input">
          <option value="">All Status</option>
          <option value="DRAFT">Draft</option>
          <option value="PUBLISHED">Published</option>
          <option value="CLOSED">Closed</option>
          <option value="ARCHIVED">Archived</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Due From</label>
        <input type="date" [(ngModel)]="filter.fromDate" class="field-input" (keydown.enter)="applyFilter()" />
      </div>
      <div class="filter-field">
        <label>Due To</label>
        <input type="date" [(ngModel)]="filter.toDate" class="field-input" (keydown.enter)="applyFilter()" />
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn-search" (click)="applyFilter()"><mat-icon>search</mat-icon> Search</button>
      <button class="btn-reset" (click)="resetFilter()"><mat-icon>refresh</mat-icon> Reset</button>
      <button class="btn-add" (click)="openForm()" *ngIf="canCreate"><mat-icon>add</mat-icon> Add Interview</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card" *ngIf="!loading; else loadingTpl">
    <table mat-table [dataSource]="dataSource" matSort class="data-table">

      <!-- Title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Interview Title</th>
        <td mat-cell *matCellDef="let i">
          <div class="cell-with-icon">
            <mat-icon class="row-icon purple">record_voice_over</mat-icon>
            <span>{{ i.title }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Batch -->
      <ng-container matColumnDef="batch">
        <th mat-header-cell *matHeaderCellDef>Batch</th>
        <td mat-cell *matCellDef="let i">
          <span class="id-chip" style="margin-right:6px">#{{ i.batchId }}</span>
          {{ getBatchName(i.batchId) }}
        </td>
      </ng-container>

      <!-- Category -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let i">
          <span class="category-chip" [class.interim]="i.interviewCategory === 'INTERIM'" [class.final]="i.interviewCategory === 'FINAL'">
            {{ getCategoryLabel(i.interviewCategory) || '—' }}
          </span>
        </td>
      </ng-container>

      <!-- Due Date -->
      <ng-container matColumnDef="dueDate">
        <th mat-header-cell *matHeaderCellDef>Due Date</th>
        <td mat-cell *matCellDef="let i">{{ i.dueDate | date:'mediumDate' }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let i">
          <span class="status-pill" [ngClass]="i.status?.toLowerCase()">{{ i.status }}</span>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let i" (click)="$event.stopPropagation()">

          <!-- Edit — hidden only when PUBLISHED -->
          <button mat-icon-button (click)="openForm(i)" matTooltip="Edit"
                  *ngIf="i.status !== 'PUBLISHED'">
            <mat-icon class="action-edit">edit</mat-icon>
          </button>

          <!-- Manage Rubrics & Publish — only DRAFT (rubrics are locked after publish) -->
          <button mat-icon-button (click)="openRubrics(i)"
                  matTooltip="Manage Rubrics &amp; Publish"
                  style="color:#818cf8"
                  *ngIf="i.status === 'DRAFT'">
            <mat-icon>list_alt</mat-icon>
          </button>

          <!-- View Results — PUBLISHED or CLOSED -->
          <button mat-icon-button (click)="viewResults(i)"
                  matTooltip="View Results"
                  style="color:#34d399"
                  *ngIf="i.status === 'PUBLISHED' || i.status === 'CLOSED'">
            <mat-icon>bar_chart</mat-icon>
          </button>

          <!-- Delete — always available -->
          <button mat-icon-button (click)="delete(i)" matTooltip="Delete">
            <mat-icon class="action-del">delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="clickable-row" (click)="openDetail(row)"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="no-data">
          No interviews found. <span *ngIf="canCreate">Click "+ Add Interview" to create one.</span>
        </td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
</ng-template>
