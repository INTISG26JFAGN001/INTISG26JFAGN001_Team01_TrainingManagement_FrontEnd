<div class="page-container">
  <div class="page-header">
    <div class="header-info"><h2>Trainers</h2><p>Manage trainers and their technology specializations</p></div>
    <button mat-flat-button color="primary" (click)="openForm()" *ngIf="isAdmin"><mat-icon>person_add</mat-icon> Add Trainer</button>
  </div>
  <mat-card class="content-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon><mat-label>Search trainers...</mat-label>
        <input matInput (keyup)="applyFilter($event)"/>
      </mat-form-field>
    </div>
    <div class="table-container" *ngIf="!loading; else loadingTpl">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let t">
            <div class="user-cell">
              <div class="avatar-trainer">{{ t.fullName?.charAt(0) }}</div>
              <span>{{ t.fullName }}</span>
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let t">{{ t.email }}</td>
        </ng-container>
        <ng-container matColumnDef="technologies">
          <th mat-header-cell *matHeaderCellDef>Technologies</th>
          <td mat-cell *matCellDef="let t">
            <mat-chip-listbox class="tech-chips">
              <mat-chip *ngFor="let tech of (t.technologies || [])">{{ tech.name }}</mat-chip>
              <span *ngIf="!t.technologies?.length" class="no-tech">—</span>
            </mat-chip-listbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let t">
            <button mat-icon-button color="warn" (click)="delete(t)" *ngIf="isAdmin" matTooltip="Remove"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow><td [attr.colspan]="displayedColumns.length" class="no-data">No trainers found.</td></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
<ng-template #loadingTpl><div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div></ng-template>
